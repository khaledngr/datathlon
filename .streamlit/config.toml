# Datathlon dashboard theme, read when Streamlit starts from the repo root. Not a secret.
[theme]
base = "light"            # also inside Snowsight, whose dark mode would hide the ink store line
primaryColor = "#3946C0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F8"
textColor = "#0B0D1F"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"   # no Deploy button
