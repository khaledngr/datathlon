version: 2

seeds:
  - name: products
    description: "Product catalogue (the required seed): the source of truth for SKUs, categories and prices."
    columns:
      - name: sku
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values: {values: ['active', 'discontinued']}
  - name: stores
    description: "The 8 stores, with coordinates for the weather API."
    columns:
      - name: store_id
        data_tests: [unique, not_null]
  - name: holidays
    description: "Holiday calendar the sales generators follow (fetch_holidays.py). Compared with the real API in a test."

models:
  - name: stg_till_sales
    description: "Every raw till line, parsed into typed columns. Not filtered."
  - name: stg_weather_days
    description: "Every API call x day, flattened. Not deduplicated."

  - name: quarantine_till_sales
    description: "Till lines rejected by a quality rule, with the reason, or resent duplicates. Never deleted."
    columns:
      - name: reject_reason
        description: "First quality rule the line breaks, or duplicate for a resent sale."
        data_tests:
          - not_null
          - accepted_values:
              values: ['missing_sale_id', 'unknown_store', 'unparseable_timestamp', 'future_timestamp',
                       'unknown_product', 'invalid_quantity', 'invalid_price', 'price_not_in_catalogue', 'duplicate']

  - name: silver_till_sales
    description: "Valid store till lines, one row per sale, prices in euros."
    columns:
      - name: sale_id
        description: "Sale ID sent by the till; the first copy is kept, resends go to quarantine."
        data_tests: [unique, not_null]
      - name: store_id
        data_tests:
          - not_null
          - relationships: {to: ref('stores'), field: store_id}
      - name: sku
        data_tests:
          - not_null
          - relationships: {to: ref('products'), field: sku}
      - name: qty
        data_tests: [not_null]
      - name: unit_price_eur
        description: "Unit price in euros; a price sent in cents is divided by 100."
        data_tests: [not_null]
      - name: payment
        description: "Payment method, spellings normalised: CARD or Card -> card, apple pay -> contactless, missing or other -> unknown."
        data_tests:
          - accepted_values: {values: ['card', 'cash', 'contactless', 'unknown']}

  - name: silver_web_orders
    description: "Web shop orders, one row per order; test orders flagged (is_test)."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values: {values: ['paid', 'cancelled', 'refunded']}
      - name: fulfilment
        description: "home_delivery, or click_collect (picked up in a store: counted in that store's stock)."
        data_tests:
          - accepted_values: {values: ['home_delivery', 'click_collect']}
      - name: country
        data_tests:
          - accepted_values: {values: ['FR', 'BE', 'ES']}
      - name: store_id
        data_tests:
          - relationships: {to: ref('stores'), field: store_id}

  - name: silver_web_order_lines
    description: "Web order lines with order and product details."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships: {to: ref('silver_web_orders'), field: order_id}
      - name: sku
        data_tests:
          - relationships: {to: ref('products'), field: sku}
      - name: category
        data_tests: [not_null]

  - name: silver_stock_daily
    description: "Night stock count, one row per day x store x product (UC2)."
    columns:
      - name: stock_key
        description: "Row key: snapshot_date|store_id|sku."
        data_tests: [unique, not_null]
      - name: store_id
        data_tests:
          - relationships: {to: ref('stores'), field: store_id}
      - name: category
        data_tests: [not_null]          # null = a SKU missing from the catalogue

  - name: silver_weather_daily
    description: "Weather per store and day, latest run (measured past, 7-day forecast)."
    columns:
      - name: weather_key
        data_tests: [unique, not_null]
      - name: store_id
        data_tests:
          - relationships: {to: ref('stores'), field: store_id}

  - name: silver_holidays
    description: "School and public holidays FR, BE, ES, latest run, same rules as the generator calendar."
    columns:
      - name: holiday_key
        data_tests: [unique, not_null]
      - name: holiday_type
        data_tests:
          - accepted_values: {values: ['school', 'public']}

  # GOLD: what the dashboard and the analyst role read. Every column described: the descriptions are also written
  # to Snowflake as table and column comments (persist_docs), so Snowsight shows them.
  - name: gold_sales_daily
    description: "UC1: units and paid revenue (EUR) per day x channel x country x category. Complete days only (D-040)."
    columns:
      - name: sales_key
        description: "Row key: sales_date|channel|country|category."
        data_tests: [unique, not_null]
      - name: sales_date
        description: "Day of the sale (UTC). A late till event counts on the day it happened, not the day it arrived."
      - name: channel
        description: "store (till lines) or web (paid web orders, click & collect included: it is ordered online)."
        data_tests:
          - accepted_values: {values: ['store', 'web']}
      - name: country
        description: "Country of the store (store) or of the order (web)."
        data_tests:
          - accepted_values: {values: ['FR', 'BE', 'ES']}
      - name: category
        description: "Product category from the catalogue seed (running, hiking, cycling, ...)."
      - name: units
        description: "Units sold."
      - name: revenue_eur
        description: "Revenue in euros = SUM(qty x unit price). Prices sent in cents are already fixed in silver."
        data_tests: [not_null]
      - name: orders_or_tickets
        description: "Distinct web orders (web) or till sales (store)."
      - name: lines
        description: "Order lines or till lines behind the row."

  - name: gold_stock_cover_daily
    description: "UC2: days of cover per day x store x product, alert under 3 days. Discontinued products excluded."
    columns:
      - name: stock_key
        description: "Row key: snapshot_date|store_id|sku."
        data_tests: [unique, not_null]
      - name: snapshot_date
        description: "Day of the night stock count. A store closed that day (Sunday in FR and BE) has no row."
      - name: store_id
        description: "Store code (PAR-01, LYO-01, ...), from the stores seed."
      - name: store_city
        description: "City of the store, for the restock list."
        data_tests: [not_null]
      - name: country
        description: "Country of the store."
      - name: sku
        description: "Product code from the catalogue."
      - name: product_name
        description: "Product name, for the restock list."
        data_tests: [not_null]
      - name: category
        description: "Product category."
      - name: on_hand
        description: "Units on the shelf at the night count."
        data_tests: [not_null]
      - name: received
        description: "Units received that day (deliveries Monday and Thursday)."
      - name: emergency
        description: "Units of a same-day emergency transfer (the shelf would have gone negative)."
      - name: units_sold_7d
        description: "Units sold in this store over the last 7 calendar days, that day included: tills + click & collect picked up here."
      - name: avg_daily_units_7d
        description: "units_sold_7d / 7."
      - name: days_of_cover
        description: "on_hand / avg_daily_units_7d: how many days the shelf lasts at the current pace. Null when nothing sold."
      - name: is_alert
        description: "True when days_of_cover < 3: restock before it runs out (UC2)."
        data_tests: [not_null]

  - name: gold_holidays
    description: "Holidays copied from silver for the dashboard shading: the analyst role reads GOLD only (step 11)."
    columns:
      - name: holiday_key
        description: "Row key: country|holiday_type|start_date|end_date."
        data_tests: [unique, not_null]
      - name: country
        description: "FR, BE or ES."
      - name: holiday_type
        description: "school or public."
      - name: start_date
        description: "First day of the holiday."
      - name: end_date
        description: "Last day of the holiday."
      - name: holiday_name
        description: "Name from the OpenHolidays API."
      - name: share
        description: "Share of the country on holiday: 0.5 for Belgium's autumn breaks (French- and Dutch-speaking communities differ), else 1."

  - name: gold_store_weather_daily
    description: "Weather per store x day (Open-Meteo): measured past next to the store's till sales, plus the 7-day forecast to prepare the week. Context only: no weather effect is claimed (D-021)."
    columns:
      - name: weather_key
        description: "Row key: store_id|weather_date."
        data_tests: [unique, not_null]
      - name: store_id
        description: "Store code, as in the stores seed."
        data_tests:
          - not_null
          - relationships: {to: ref('stores'), field: store_id}
      - name: store_city
        description: "City of the store."
      - name: country
        description: "FR, BE or ES."
      - name: weather_date
        description: "Day of the weather (local day of the store)."
        data_tests: [not_null]
      - name: is_forecast
        description: "True for the days still to come (forecast); false once the day is measured."
        data_tests: [not_null]
      - name: temp_max_c
        description: "Highest temperature of the day, in degrees C."
      - name: temp_min_c
        description: "Lowest temperature of the day, in degrees C."
      - name: rain_mm
        description: "Rain over the day, in mm."
      - name: wind_max_kmh
        description: "Strongest wind of the day, in km/h."
      - name: weather_label
        description: "rainy (2 mm of rain or more), hot (25 C or more), cold (under 8 C), else mild."
        data_tests:
          - accepted_values: {values: ['rainy', 'hot', 'cold', 'mild']}
      - name: store_units
        description: "Units sold at the store's tills that day (complete days only; empty for forecast days)."
      - name: store_revenue_eur
        description: "Till revenue of the store that day, in EUR (complete days only; empty for forecast days)."

  - name: gold_data_quality_daily
    description: "Till feed quality per file day x store: raw, silver and quarantined lines (by reason), prices fixed."
    columns:
      - name: quality_key
        description: "Row key: file_date|store_id."
        data_tests: [unique, not_null]
      - name: file_date
        description: "Day of the till file (its folder in the bucket), i.e. the day the lines were sent."
      - name: store_id
        description: "Store code, or UNKNOWN when the store could not be recognised."
      - name: raw_lines
        description: "Lines received. raw_lines = silver_lines + quarantine_lines (test assert_gold_quality_lines_add_up)."
      - name: silver_lines
        description: "Lines kept in silver (valid, possibly repaired)."
      - name: quarantine_lines
        description: "Lines set aside in QUARANTINE_TILL_SALES, all reasons."
      - name: quarantine_pct
        description: "100 x quarantine_lines / raw_lines."
      - name: price_fixed_from_cents
        description: "Silver lines whose price was sent in cents and divided by 100 (Lyon, 24 Oct)."
      - name: q_duplicate
        description: "Quarantined: the same sale sent again (till retry)."
      - name: q_missing_sale_id
        description: "Quarantined: no sale ID."
      - name: q_unknown_store
        description: "Quarantined: store name not recognised even after normalising."
      - name: q_unparseable_timestamp
        description: "Quarantined: sale time in no known format."
      - name: q_future_timestamp
        description: "Quarantined: sale time after the load time, compared in UTC (e.g. year 2099)."
      - name: q_unknown_product
        description: "Quarantined: SKU not in the catalogue."
      - name: q_invalid_quantity
        description: "Quarantined: quantity missing, not a number or outside 1-20."
      - name: q_invalid_price
        description: "Quarantined: price missing or not a number."
      - name: q_price_not_in_catalogue
        description: "Quarantined: price matches neither the catalogue price nor 100x it."

  - name: gold_cost_showback_daily
    description: "Showback / chargeback: Snowflake credits of our warehouses per day and team, idle time shared out so the total equals the bill (docs/GOVERNANCE.md)."
    columns:
      - name: showback_key
        description: "Row key: usage_date|warehouse_name|cost_center."
        data_tests: [unique, not_null]
      - name: usage_date
        description: "UTC day of the usage."
        data_tests: [not_null]
      - name: warehouse_name
        description: "DATATHLON_WH (pipeline) or DATATHLON_BI_WH (dashboard)."
      - name: cost_center
        description: "Team that pays: ingestion, transformation, bi, or platform (shared, unattributed work)."
        data_tests:
          - accepted_values: {values: ["ingestion", "transformation", "bi", "platform"]}
      - name: owner
        description: "Team member who answers for that cost (docs/OWNERSHIP.md)."
      - name: query_credits
        description: "Credits of the team's queries (QUERY_ATTRIBUTION_HISTORY)."
      - name: idle_credits
        description: "The team's share of warehouse time with no query running (start-up, 60 s before auto-suspend)."
      - name: total_credits
        description: "query_credits + idle_credits: what the team is charged."
      - name: total_usd
        description: "total_credits x the account's price per credit (var credit_price_usd)."

  - name: gold_source_freshness
    description: "Data freshness: when each of the 5 sources last delivered to BRONZE (a live view, read by the dashboard's Data quality tab)."
    columns:
      - name: position
        description: "Order of the source on the dashboard."
      - name: source_name
        description: "Web orders, Store tills, Stock counts, Weather, Holidays."
        data_tests: [unique, not_null]
      - name: ingestion
        description: "How the source arrives."
      - name: last_loaded_utc
        description: "Last time a row of this source reached BRONZE (UTC)."
        data_tests: [not_null]
      - name: rows_in_bronze
        description: "Rows of this source in BRONZE."
